    <title>StudentHub University - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* ================= LIGHT MODE ================= */

    body {
        background-color: #F5F7FA;
        color: #222222;
        transition: background-color 0.3s, color 0.3s;
        margin: 0;
    }

    .theme-toggle {
        position: fixed;
        top: 15px;
        right: 20px;
        z-index: 9999;

        padding: 10px 18px;

        border: none;
        border-radius: 25px;

        background-color: #002147;
        color: white;

        font-size: 14px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);

        transition: 0.3s;
    }

    .theme-toggle:hover {
        transform: scale(1.05);
    }


    /* ================= DARK MODE ================= */

    body.dark-mode {
        background-color: #121212 !important;
        color: #ffffff !important;
    }

    body.dark-mode .header {
        background-color: #1e1e1e !important;
    }

    body.dark-mode .university-title {
        color: #ffffff !important;
    }

    body.dark-mode .university-subtitle {
        color: #dddddd !important;
    }

    body.dark-mode .login-container {
        background-color: #1e1e1e !important;
        color: #ffffff !important;
    }

    body.dark-mode .login-header {
        background-color: #333333 !important;
        color: #FFD54F !important;
    }

    body.dark-mode .login-form label {
        color: #ffffff !important;
    }

    body.dark-mode .login-form input[type="text"],
    body.dark-mode .login-form input[type="password"] {
        background-color: #2b2b2b !important;
        color: #ffffff !important;
        border: 1px solid #666666 !important;
    }

    body.dark-mode .login-form input::placeholder {
        color: #bbbbbb !important;
    }

    body.dark-mode .register-link a {
        color: #FFD54F !important;
    }

    body.dark-mode .theme-toggle {
        background-color: #FFD54F;
        color: #002147;
    }
</style>
</head>


<button id="themeToggle" class="theme-toggle"
    onclick="
        document.body.classList.toggle('dark-mode');
        this.innerHTML = document.body.classList.contains('dark-mode')
            ? '☀️ Light Mode'
            : '🌙 Dark Mode';
    ">
    🌙 Dark Mode
</button>
